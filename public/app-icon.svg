<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#glowGrad)" stroke-width="8" opacity="0.6"/>
  
  <!-- Dumbbell / Energy Nutrition Icon -->
  <g transform="translate(106, 120)" stroke="url(#glowGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Barbell weights left -->
    <rect x="0" y="70" width="36" height="140" rx="12" fill="#3b82f6" stroke="#60a5fa" stroke-width="8"/>
    <rect x="36" y="95" width="24" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
    <!-- Center bar -->
    <line x1="60" y1="140" x2="240" y2="140" stroke="#f8fafc" stroke-width="20"/>
    <!-- POS Terminal screen in center -->
    <rect x="95" y="80" width="110" height="120" rx="16" fill="#1e293b" stroke="url(#glowGrad)" stroke-width="8"/>
    <line x1="115" y1="110" x2="185" y2="110" stroke="#10b981" stroke-width="8"/>
    <line x1="115" y1="135" x2="165" y2="135" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="150" cy="170" r="10" fill="#f59e0b"/>
    <!-- Barbell weights right -->
    <rect x="240" y="95" width="24" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
    <rect x="264" y="70" width="36" height="140" rx="12" fill="#10b981" stroke="#34d399" stroke-width="8"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="390" font-family="Inter, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">APEXCORE</text>
  <text x="256" y="430" font-family="Inter, sans-serif" font-weight="600" font-size="20" fill="#38bdf8" text-anchor="middle" letter-spacing="8">POS DESKTOP</text>
</svg>
